<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cao Võ: Trường Thương Hắc Viêm Trấn Yêu Ma</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d27;
            --sidebar-bg: #141721;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.2);
            --border-color: #2e3648;
            --content-font: 'Merriweather', serif;
            --font-size: 19px;
            --line-height: 1.85;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --sidebar-bg: #f1f5f9;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --accent: #ea580c;
            --accent-glow: rgba(234, 88, 12, 0.15);
            --border-color: #e2e8f0;
        }

        [data-theme="sepia"] {
            --bg-color: #f4ecd8;
            --card-bg: #eadeca;
            --sidebar-bg: #eedfca;
            --text-color: #433422;
            --text-muted: #79654d;
            --accent: #b45309;
            --accent-glow: rgba(180, 83, 9, 0.15);
            --border-color: #dfceb7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .novel-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .novel-header h1 {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .novel-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .chapter-search {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-search input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .chapter-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 12px 8px;
        }

        .chapter-item {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-item:hover {
            background: var(--card-bg);
            color: var(--accent);
        }

        .chapter-item.active {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* Main Content */
        main {
            margin-left: 320px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-nav {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            z-index: 50;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Reader Area */
        .reader-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px 100px;
            width: 100%;
        }

        .reader-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
        }

        .reader-meta {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .reader-body {
            font-family: var(--content-font);
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: -0.01em;
        }

        .reader-body p {
            margin-bottom: 1.5em;
            text-align: justify;
        }

        /* Bottom Nav */
        .reader-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .reader-nav button {
            padding: 10px 20px;
            font-size: 14px;
        }

        /* Mobile Hamburger */
        .menu-toggle {
            display: none;
        }

        @media (max-width: 900px) {
            aside {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            aside.open {
                transform: translateX(0);
            }
            main {
                margin-left: 0;
            }
            .menu-toggle {
                display: block;
            }
            .top-nav {
                padding: 12px 16px;
            }
            .reader-container {
                padding: 24px 16px 80px;
            }
            .reader-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="novel-header">
            <span class="badge">Đô Thị Cao Võ</span>
            <h1>Cao Võ: Trường Thương Hắc Viêm Trấn Yêu Ma</h1>
            <p>Tác giả: Nam Tường Hạ Đích Hắc Miêu</p>
        </div>
        <div class="chapter-search">
            <input type="text" id="searchInput" placeholder="Tìm số chương hoặc tên..." oninput="filterChapters()">
        </div>
        <ul class="chapter-list" id="chapterList"></ul>
    </aside>

    <!-- Main -->
    <main>
        <div class="top-nav">
            <div class="btn-group">
                <button class="menu-toggle" onclick="toggleSidebar()">☰ Mục lục</button>
                <button onclick="changeFontSize(-1)">A-</button>
                <button onclick="changeFontSize(1)">A+</button>
            </div>
            <div class="btn-group">
                <button onclick="setTheme('dark')">🌙 Tối</button>
                <button onclick="setTheme('sepia')">📜 Giấy</button>
                <button onclick="setTheme('light')">☀️ Sáng</button>
            </div>
        </div>

        <div class="reader-container">
            <h2 class="reader-title" id="chapterTitle">Đang tải...</h2>
            <div class="reader-meta" id="chapterMeta">Đang chuẩn bị dữ liệu</div>
            <div class="reader-body" id="chapterContent"></div>

            <div class="reader-nav">
                <button id="prevBtn" onclick="prevChapter()">← Chương trước</button>
                <button id="nextBtn" onclick="nextChapter()">Chương sau →</button>
            </div>
        </div>
    </main>

    <script>
        let chapters = [];
        let currentChapterIndex = 0;

        async function init() {
            try {
                const res = await fetch('chapters.json');
                chapters = await res.json();
                renderChapterList();
                
                // Get chapter from URL hash or default 0
                const hash = window.location.hash.replace('#', '');
                const targetIdx = chapters.findIndex(c => c.id === hash);
                loadChapter(targetIdx !== -1 ? targetIdx : 0);
            } catch (e) {
                document.getElementById('chapterTitle').innerText = "Không thể tải danh sách chương";
                document.getElementById('chapterContent').innerHTML = "<p>Vui lòng đảm bảo file <code>chapters.json</code> tồn tại.</p>";
            }
        }

        function renderChapterList() {
            const list = document.getElementById('chapterList');
            list.innerHTML = '';
            chapters.forEach((chap, idx) => {
                const li = document.createElement('li');
                li.className = `chapter-item ${idx === currentChapterIndex ? 'active' : ''}`;
                li.innerText = chap.title;
                li.onclick = () => {
                    loadChapter(idx);
                    if (window.innerWidth <= 900) toggleSidebar();
                };
                list.appendChild(li);
            });
        }

        function filterChapters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.chapter-item');
            items.forEach((item, idx) => {
                const text = chapters[idx].title.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function loadChapter(idx) {
            if (idx < 0 || idx >= chapters.length) return;
            currentChapterIndex = idx;
            const chap = chapters[idx];
            
            window.location.hash = chap.id;
            document.getElementById('chapterTitle').innerText = chap.title;
            document.getElementById('chapterMeta').innerText = `Chương ${chap.chapterNumber || (idx + 1)} / ${chapters.length} • Nhân vật chính: Thẩm Trường An`;

            const paras = chap.content.split('\n\n').filter(p => p.trim());
            document.getElementById('chapterContent').innerHTML = paras.map(p => `<p>${p}</p>`).join('');

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Update UI
            document.querySelectorAll('.chapter-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            document.getElementById('prevBtn').disabled = idx === 0;
            document.getElementById('nextBtn').disabled = idx === chapters.length - 1;
        }

        function prevChapter() {
            if (currentChapterIndex > 0) loadChapter(currentChapterIndex - 1);
        }

        function nextChapter() {
            if (currentChapterIndex < chapters.length - 1) loadChapter(currentChapterIndex + 1);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('novel_theme', theme);
        }

        let fontSize = 19;
        function changeFontSize(delta) {
            fontSize = Math.min(26, Math.max(15, fontSize + delta));
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
            localStorage.setItem('novel_font_size', fontSize);
        }

        // Restore settings
        const savedTheme = localStorage.getItem('novel_theme');
        if (savedTheme) setTheme(savedTheme);
        const savedFontSize = localStorage.getItem('novel_font_size');
        if (savedFontSize) changeFontSize(parseInt(savedFontSize) - fontSize);

        init();
    </script>
</body>
</html>
